<!doctype html><html lang='en'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>MiTV Quiet Launcher · Photo upload</title><style>body{max-width:640px;margin:48px auto;padding:0 24px;background:#1a1c20;color:#eee;font:18px/1.7 sans-serif}h1{font-size:28px}input,button{font:inherit;padding:12px;margin:8px 0;border-radius:8px;max-width:100%;box-sizing:border-box}button{background:#63debd;border:0}pre{white-space:pre-wrap;font:inherit;color:#b3c4be}</style><h1>Add photos to the TV screensaver</h1><p id='intro'>Enter the code shown on the TV, then choose photos.</p><p>JPG, PNG, WebP and BMP. Up to 24 photos, 32 MB each.</p><label>Connection code <input id='code' type='password' inputmode='numeric' maxlength='6' autocomplete='off' placeholder='Six digits'></label><br><input id='files' type='file' accept='image/jpeg,image/png,image/webp,image/bmp' multiple><br><button id='send'>Save to TV screensaver</button><pre id='result' role='status'></pre><p>Uploads work only while the TV upload page is open. Photos are copied to the TV; originals stay on your computer or phone.</p><script>function connectFromScan(){var m=/^#code=([0-9]{6})$/.exec(location.hash);if(!m)return;document.getElementById('code').value=m[1];document.getElementById('intro').textContent='Code filled in. Choose photos, then save them to the TV screensaver.';try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}connectFromScan();window.addEventListener('hashchange',connectFromScan);document.getElementById('send').onclick=async function(){var b=this,r=document.getElementById('result'),c=document.getElementById('code').value,f=document.getElementById('files').files;if(!/^\d{6}$/.test(c)||!f.length){r.textContent='Enter the six-digit code and choose photos';return;}b.disabled=true;r.textContent='';try{for(var i=0;i<f.length;i++){var x=f[i];r.textContent+='['+(i+1)+'/'+f.length+'] '+x.name+'：';if(x.size>33554432||!x.size){r.textContent+='Skipped: empty file or over 32 MB\n';continue;}var q=await fetch('/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-QuietTV-Code':c},body:x});r.textContent+=(await q.text())+'\n';if(q.status===403||q.status===429)break;}}catch(e){r.textContent+='Connection interrupted. Check that the TV upload page is still open';}finally{b.disabled=false;}}</script></html>
