<!doctype html><html lang='zh-CN'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>简净桌面 · 屏保传图</title><style>body{max-width:640px;margin:48px auto;padding:0 24px;background:#1a1c20;color:#eee;font:18px/1.7 sans-serif}h1{font-size:28px}input,button{font:inherit;padding:12px;margin:8px 0;border-radius:8px;max-width:100%;box-sizing:border-box}button{background:#63debd;border:0}pre{white-space:pre-wrap;font:inherit;color:#b3c4be}</style><h1>把照片加入电视屏保</h1><p id='intro'>请输入电视上显示的连接码，然后选择照片。</p><p>支持 JPG、PNG、WebP、BMP，最多24张，单张32MB。</p><label>连接码 <input id='code' type='password' inputmode='numeric' maxlength='6' autocomplete='off' placeholder='六位数字'></label><br><input id='files' type='file' accept='image/jpeg,image/png,image/webp,image/bmp' multiple><br><button id='send'>保存到电视屏保</button><pre id='result' role='status'></pre><p>传输仅在电视的传图页面打开时可用。照片保存在电视内，电脑和手机的原图保留。</p><script>function connectFromScan(){var m=/^#code=([0-9]{6})$/.exec(location.hash);if(!m)return;document.getElementById('code').value=m[1];document.getElementById('intro').textContent='连接码已填好，请选择照片，然后保存到电视屏保。';try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}connectFromScan();window.addEventListener('hashchange',connectFromScan);document.getElementById('send').onclick=async function(){var b=this,r=document.getElementById('result'),c=document.getElementById('code').value,f=document.getElementById('files').files;if(!/^\d{6}$/.test(c)||!f.length){r.textContent='请填写六位连接码并选择照片';return;}b.disabled=true;r.textContent='';try{for(var i=0;i<f.length;i++){var x=f[i];r.textContent+='['+(i+1)+'/'+f.length+'] '+x.name+'：';if(x.size>33554432||!x.size){r.textContent+='跳过，文件为空或超过32MB\n';continue;}var q=await fetch('/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-QuietTV-Code':c},body:x});r.textContent+=(await q.text())+'\n';if(q.status===403||q.status===429)break;}}catch(e){r.textContent+='连接中断，请确认电视仍停留在传图页面';}finally{b.disabled=false;}}</script></html>
